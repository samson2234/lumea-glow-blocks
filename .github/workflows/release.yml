# Push a tag like v1.4.1 → this builds lumea-glow-blocks.zip and publishes a GitHub Release.
# WordPress then shows "Update available" for Lumea Glow Blocks.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HDR=$(grep -m1 -oP 'Version:\s*\K[0-9.]+' lumea-glow-blocks.php)
          CONST=$(grep -m1 -oP "'LG_VER', '\K[0-9.]+" lumea-glow-blocks.php)
          echo "tag=$TAG header=$HDR const=$CONST"
          [ "$TAG" = "$HDR" ] && [ "$TAG" = "$CONST" ] || { echo "::error::Bump Version and LG_VER in lumea-glow-blocks.php to $TAG"; exit 1; }
      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Build zip
        run: |
          mkdir -p build/lumea-glow-blocks
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude '.gitignore' --exclude 'README.md' ./ build/lumea-glow-blocks/
          cd build && zip -rq lumea-glow-blocks.zip lumea-glow-blocks
      - uses: softprops/action-gh-release@v2
        with:
          files: build/lumea-glow-blocks.zip
          generate_release_notes: true
